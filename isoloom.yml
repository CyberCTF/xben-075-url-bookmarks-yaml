# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-075-24 URL Bookmarks - YAML (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask bookmark manager that keeps each visitor's saved URLs in a YAML-encoded browser cookie.
# The benchmark folder benchmarks/XBEN-075-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/deserialization-yaml-bookmarks/app/, built by its own Dockerfiles; the overlay in build/deserialization-yaml-bookmarks/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-075-url-bookmarks-yaml

networks:
  lab: { cidr: 10.61.118.0/24, internet: false }

machines:
  deserialization-yaml-bookmarks:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/deserialization-yaml-bookmarks

checks:
  - name: the URL Bookmarks - YAML page answers
    http: http://deserialization-yaml-bookmarks:80/list
    wait: 180
  - name: the bookmark list hands out its bookmarks cookie
    script: checks/probe.sh
    wait: 60

message: |
  URL Bookmarks - YAML answers at http://localhost:{{ machines.deserialization-yaml-bookmarks.services.0.publish }}/.
  The bookmarks are stored in a cookie. What format is it in, and how is it read back?
